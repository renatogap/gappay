services:
    app:
        build:
            args:
                # Use o usuário local quando definido, senão use um usuário genérico
                user: ${LOCAL_USER:-www-data}
                uid: ${LOCAL_UID:-1000}
            context: ./
            dockerfile: docker/php/php.dockerfile
        image: php84
        extra_hosts:
            - host.docker.internal:host-gateway
        container_name: gappay-app
        restart: unless-stopped
        working_dir: /var/www
        environment:
            APP_NAME: gappay
            NOME_SISTEMA: "GapPay"
            DESENVOLVIDO_POR: "Rentec Digital"
            APP_USUARIO: ${LOCAL_USER:-www-data}
            APP_ENV: local
            APP_TIMEZONE: UTC
            APP_URL: http://localhost:${APP_PORT}
            ASSETS_URL: http://nginx:${APP_PORT}
            URL_FRONT: http://localhost:${APP_PORT}

            STRIPE_SECRET: ${STRIPE_SECRET}
            
            DB_CONNECTION: ${DB_CONNECTION}
            DB_HOST: ${DB_HOST}
            DB_PORT: ${DB_PORT}
            DB_DATABASE: ${DB_DATABASE}
            DB_USERNAME: ${DB_USERNAME}
            DB_PASSWORD: ${DB_PASSWORD}
        volumes:
            - ./:/var/www
            - ./docker/php/php.ini:/usr/local/etc/php/conf.d/php.ini
            - ./docker/php/.bashrc:/home/${LOCAL_USER:-www-data}/.bashrc
            - ./docker/php/auth.json:/home/${LOCAL_USER:-www-data}/.composer/auth.json
        networks:
            - dev

    nginx:
        image: nginx:alpine
        container_name: gappay-nginx
        restart: unless-stopped
        ports:
            - "${APP_PORT}:8000"
        volumes:
            - ./:/var/www
            - ./docker/nginx:/etc/nginx/conf.d
        networks:
            - dev
        links:
            - app

    ############################
    # MySQL
    ############################
    db:
        image: mysql:latest
        container_name: gappay-db
        #command: --default-authentication-plugin=mysql_native_password
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
            MYSQL_DATABASE: ${DB_DATABASE}
        ports:
            - "${DB_PORT}:3306"
        volumes:
            - mysql-storage:/var/lib/mysql
        networks:
            - dev
networks:
    dev:
        driver: bridge

volumes:
  mysql-storage:
